<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <!-- Spool Top Rim -->
  <rect x="12" y="8" width="40" height="7" rx="3.5" fill="#2563EB" />
  
  <!-- Spool Bottom Rim -->
  <rect x="12" y="49" width="40" height="7" rx="3.5" fill="#2563EB" />

  <!-- Central Spool Barrel / Filament Windings -->
  <rect x="18" y="15" width="28" height="34" rx="2" fill="#2563EB" />
  
  <!-- Winding lines (Dark blue / grooves) -->
  <line x1="18" y1="20" x2="46" y2="20" stroke="#1D4ED8" stroke-width="2" />
  <line x1="18" y1="25" x2="46" y2="25" stroke="#1D4ED8" stroke-width="2" />
  <line x1="18" y1="30" x2="46" y2="30" stroke="#1D4ED8" stroke-width="2" />
  <line x1="18" y1="35" x2="46" y2="35" stroke="#1D4ED8" stroke-width="2" />
  <line x1="18" y1="40" x2="46" y2="40" stroke="#1D4ED8" stroke-width="2" />
  <line x1="18" y1="45" x2="46" y2="45" stroke="#1D4ED8" stroke-width="2" />

  <!-- Green Filament Strand emerging and curving down -->
  <path d="M42 34 C50 34 54 40 54 52" stroke="#10B981" stroke-width="5" stroke-linecap="round" fill="none" />
</svg>
