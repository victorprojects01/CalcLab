<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none" width="100%" height="100%">
  <!-- CalcLab Cube Icon -->
  <g transform="translate(10, 10)">
    <!-- Top Face (Blue with Filament) -->
    <path d="M50 8 L92 32 L50 56 L8 32 Z" fill="#2563EB" />
    <!-- Filament Curve on Top Face -->
    <path d="M48 10 C46 22 56 26 48 38 C44 44 48 50 52 55" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Left Face (White with Dark Dice Dots) -->
    <path d="M8 32 L50 56 L50 102 L8 78 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="20" cy="58" r="4.5" fill="#0F172A" />
    <circle cx="34" cy="74" r="4.5" fill="#0F172A" />

    <!-- Right Face (Dark Navy with White Grid Dots) -->
    <path d="M50 56 L92 32 L92 78 L50 102 Z" fill="#0F172A" />
    <!-- White Pixel Grid on Right Face -->
    <rect x="62" y="52" width="4.5" height="4.5" rx="1" fill="#FFFFFF" />
    <rect x="70" y="47" width="4.5" height="4.5" rx="1" fill="#FFFFFF" />
    <rect x="78" y="42.5" width="4.5" height="4.5" rx="1" fill="#FFFFFF" />
    <rect x="62" y="62" width="4.5" height="4.5" rx="1" fill="#FFFFFF" />
    <rect x="70" y="57" width="4.5" height="4.5" rx="1" fill="#FFFFFF" />
    <rect x="78" y="52.5" width="4.5" height="4.5" rx="1" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="120" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em" fill="#1E293B">CalcLab<tspan fill="#10B981">.</tspan></text>
  <text x="122" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="-0.01em" fill="#64748B">Quanto custa sua impressão 3D?</text>
</svg>
